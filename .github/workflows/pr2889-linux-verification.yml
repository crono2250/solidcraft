name: PR 2889 latest-main verification
on:
  push:
    branches: [qa/pr2889-ci-20261020]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '2'
      RAYON_NUM_THREADS: '2'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3027e0f98a213de34c153d817c6ff4d6c6469d5a
          fetch-depth: 0
          persist-credentials: false
      - name: Rebase exact PR source onto the recorded main
        run: |
          test "$(git rev-parse HEAD)" = '3027e0f98a213de34c153d817c6ff4d6c6469d5a'
          git fetch --no-tags https://github.com/tangency-labs/solidcraft.git 58303ba036c990dd14c331c458c62a73e1a417fc
          git -c user.name='CI verification' -c user.email='ci-verification@users.noreply.github.com' rebase 58303ba036c990dd14c331c458c62a73e1a417fc
          git merge-base --is-ancestor 58303ba036c990dd14c331c458c62a73e1a417fc HEAD
          test "$(git rev-list --count 58303ba036c990dd14c331c458c62a73e1a417fc..HEAD)" = 1
          printf '%s\n' crates/ui-egui/src/dialogs_assembly.rs crates/ui-egui/src/viewport.rs crates/ui-egui/src/viewport_navigation_cache_tests.rs | sort > /tmp/pr2889-expected-files
          git diff --name-only 58303ba036c990dd14c331c458c62a73e1a417fc HEAD | sort | diff -u /tmp/pr2889-expected-files -
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo 'BASE=58303ba036c990dd14c331c458c62a73e1a417fc'
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-tests
          save-if: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Five navigation and rendering-cache regressions
        run: |
          cargo test --locked --profile ci -p solidcraft-ui-egui --lib viewport::navigation_cache_tests:: -- --test-threads=2
      - name: Previously failing catalog validation
        run: |
          cargo test --locked --profile ci -p solidcraft-ui-egui --lib i18n::tests::catalogs_have_valid_ids_and_matching_placeholders -- --exact --test-threads=2
      - name: Ordinary mouse orbit
        run: |
          cargo test --locked --profile ci -p solidcraft-ui-egui --lib viewport::tests::an_erratic_cursor_orbit_keeps_its_pivot_and_comes_back -- --exact --test-threads=2
      - name: Ground grid integration
        run: |
          cargo test --locked --profile ci -p solidcraft-ui-egui --lib viewport::grid_plane_tests:: -- --test-threads=2
      - name: File URI paste on Linux
        run: |
          cargo test --locked --profile ci -p solidcraft-ui-egui --lib agent_chat::paste::tests::a_text_of_file_links_attaches_the_files_but_other_text_does_not -- --exact --test-threads=2
      - name: Thread preview diagnostic
        run: |
          cargo test --locked --profile ci -p solidcraft-ui-egui --lib preselect_tests::modelled_thread_preview_updates_reports_errors_and_cancels_without_changes -- --exact --test-threads=2
