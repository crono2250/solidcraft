name: PR 1950 physical regressions
on:
  push:
    branches: [qa/pr1950-geometry-checks]
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '2'
      RAYON_NUM_THREADS: '2'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5e89d2c11c8faabad61b8184620a54a8c670087e
      - name: Verify exact PR source
        run: >-
          test "$(git rev-parse HEAD)" = '5e89d2c11c8faabad61b8184620a54a8c670087e'
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-tests
          save-if: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Independent physical checks for seeds 34 and 67
        run: >-
          cargo test --locked --profile ci -p solidcraft-engine --lib fuzz::tests:: -- --test-threads=2
      - name: Edge-only contact at three scales and both operand orders
        run: >-
          cargo test --locked --profile ci -p solidcraft-kernel --test boolean_props edge_only_box_contact_is_scale_invariant -- --exact --test-threads=2
      - name: Icon-tool checks on Linux
        run: >-
          python3 -B -m unittest discover -s tests/tools -p 'test_icon*.py'
